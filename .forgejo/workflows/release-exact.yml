name: release-exact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-release-exact
  cancel-in-progress: false

jobs:
  images:
    runs-on: docker
    container:
      image: docker.io/library/docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
    env:
      DOCKER_HOST: tcp://172.17.0.1:2375
      OCI_PREFIX: git.perish.top/perishfire/images
      REVISION: ${{ github.sha }}
      TAG: sha-${{ github.sha }}
    steps:
      - name: Checkout
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -eu
          apk add --no-cache git
          git init .
          git remote add origin "$REPOSITORY"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD

      - name: Authenticate
        env:
          OCI_TOKEN: ${{ secrets.OCI_TOKEN }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          set -eu
          test -n "$OCI_PREFIX"
          test -n "$OCI_USER"
          test -n "$OCI_TOKEN"
          registry=${OCI_PREFIX%%/*}
          test "$registry" != "$OCI_PREFIX"
          printf '%s' "$OCI_TOKEN" | docker login "$registry" --username "$OCI_USER" --password-stdin

      - name: Publish
        run: |
          set -eu
          docker buildx inspect --bootstrap
          docker buildx bake --push

      - name: Prove public readback
        run: |
          set -eu
          registry=${OCI_PREFIX%%/*}
          docker logout "$registry"
          docker buildx imagetools inspect "${OCI_PREFIX}/forge:${TAG}"
